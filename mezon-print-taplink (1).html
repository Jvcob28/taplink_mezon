<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezon Print — ссылки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#f6f5f1;
    --paper-card:#ffffff;
    --pink:#e63875;
    --teal:#12968a;
    --line: rgba(26,26,26,0.16);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      radial-gradient(rgba(26,26,26,0.07) 1px, transparent 1.2px);
    background-size: 14px 14px;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding: 48px 18px 40px;
  }

  .sheet{
    width:100%;
    max-width:420px;
    position:relative;
    animation: settle 0.6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes settle{
    from{ opacity:0; transform: scale(.96) translateY(10px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .sheet{ animation:none; }
  }

  /* crop marks — corners of the "sheet" being printed */
  .crop{
    position:absolute;
    width:16px; height:16px;
    pointer-events:none;
  }
  .crop::before, .crop::after{
    content:"";
    position:absolute;
    background: var(--ink);
    opacity:0.55;
  }
  .crop::before{ width:16px; height:1px; top:8px; left:0; }
  .crop::after{ width:1px; height:16px; left:8px; top:0; }
  .crop.tl{ top:-28px; left:-14px; }
  .crop.tr{ top:-28px; right:-14px; }
  .crop.bl{ bottom:-28px; left:-14px; }
  .crop.br{ bottom:-28px; right:-14px; }

  header{
    text-align:center;
    padding: 4px 0 28px;
  }

  .mark{
    width:220px;
    margin:0 auto 6px;
    position:relative;
  }
  .mark img{ width:100%; height:auto; display:block; }

  .subline{
    margin-top:10px;
    font-size:12.5px;
    color: rgba(26,26,26,0.62);
    letter-spacing: 0.01em;
  }
  .subline b{ color:var(--teal); font-weight:500; }

  .specs{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:14px;
    font-size:10.5px;
    color: rgba(26,26,26,0.45);
  }
  .specs span{ white-space:nowrap; }
  .specs i{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--pink);
    margin-right:5px;
    position:relative;
    top:-1px;
  }
  .specs span:nth-child(2) i{ background:var(--teal); }
  .specs span:nth-child(3) i{ background:var(--ink); }

  nav{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link{
    position:relative;
    display:block;
    text-decoration:none;
    color:var(--ink);
  }

  .link .shadow{
    position:absolute;
    inset:0;
    border-radius:10px;
    background: var(--teal);
    transform: translate(5px,5px);
    transition: transform .16s ease;
  }
  .link:nth-child(odd) .shadow{ background:var(--pink); }

  .link .face{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background: var(--paper-card);
    border:1.4px solid var(--ink);
    border-radius:10px;
    padding:15px 18px;
    transition: transform .16s ease;
  }

  .link:hover .face, .link:focus-visible .face{
    transform: translate(5px,5px);
  }
  .link:hover .shadow, .link:focus-visible .shadow{
    transform: translate(0,0);
  }
  .link:active .face{ transform: translate(2px,2px); }

  .link:focus-visible .face{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }

  .label{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:16px;
  }
  .hint{
    font-size:10.5px;
    color: rgba(26,26,26,0.5);
    margin-top:2px;
    font-family:'IBM Plex Mono', monospace;
  }
  .go{
    font-size:16px;
    color: rgba(26,26,26,0.35);
    flex-shrink:0;
  }

  footer{
    margin-top:34px;
    text-align:center;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
  }
  .socials a{
    width:38px; height:38px;
    border-radius:50%;
    border:1.4px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--ink);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .socials a svg{ width:16px; height:16px; }
  .socials a:nth-child(1):hover{ background:var(--pink); border-color:var(--pink); color:#fff; }
  .socials a:nth-child(2):hover{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .socials a:nth-child(3):hover{ background:var(--ink); color:#fff; }

  .fineprint{
    font-size:10.5px;
    color: rgba(26,26,26,0.4);
    line-height:1.6;
  }
</style>
</head>
